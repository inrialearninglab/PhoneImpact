image: alpine:latest

pages:
    stage: deploy

    script:
        - apk add --no-cache bash coreutils findutils

        - export BASE_GITHUB_URL="https://phoneimpact.inria.fr"

        - mkdir -p public

        # For every .md file in docs
        - |
            find docs -name "*.md" | while read file; do
              rel_path="${file#docs/}"         # e.g. PrintAndPlay/index.md
              filename=$(basename "$rel_path") # e.g. index.md
              rel_dir=$(dirname "$rel_path")   # e.g. PrintAndPlay

              if [ "$filename" = "index.md" ]; then
                out_path="public/${rel_dir}/index.html"
                url_path="${rel_dir}/"
              else
                name_noext="${filename%.md}"
                out_path="public/${rel_dir}/${name_noext}.html"
                url_path="${rel_dir}/${name_noext}/"
              fi

              url_path=$(echo "$url_path" | sed 's| |%20|g')
              redirect_url="$BASE_GITHUB_URL/$url_path"
              mkdir -p "$(dirname "$out_path")"

              echo '<!DOCTYPE html>' > "$out_path"
              echo '<html>' >> "$out_path"
              echo '  <head>' >> "$out_path"
              echo "    <meta http-equiv=\"refresh\" content=\"0; url=$redirect_url\" />" >> "$out_path"
              echo "    <script>window.location.href = '$redirect_url';</script>" >> "$out_path"
              echo '    <title>Redirecting…</title>' >> "$out_path"
              echo '  </head>' >> "$out_path"
              echo '  <body>' >> "$out_path"
              echo "    <p>If you are not redirected, <a href=\"$redirect_url\">click here</a>.</p>" >> "$out_path"
              echo '  </body>' >> "$out_path"
              echo '</html>' >> "$out_path"
            done
            artifacts:
                paths:
                    - public
            only:
                - main

create-cards:
    stage: deploy
    image: viaudnathan/phone-impact
    script:
        - ls -al
        - cd app
        - ls -al
        - rake pnp
    artifacts:
        expire_in: 3 days
        paths:
            - _output
    only:
        - manual
